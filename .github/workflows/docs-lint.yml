name: Docs & Skill Linting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Frontmatter & Skill Structure Lint
        run: python tools/lint_skills.py .

      - name: Generated READMEs Freshness Check
        run: python tools/render_skill_readmes.py . --check
